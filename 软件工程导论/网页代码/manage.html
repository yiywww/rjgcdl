<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员后台</title>
  <link rel="stylesheet" href="manage.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">管理后台</div>
        <button class="toggle-btn" id="toggleSidebar">
          <span></span>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-module="pets">
          <span class="nav-icon">🐾</span>
          <span class="nav-text">宠物管理</span>
        </a>
        <a href="#" class="nav-item" data-module="adoptions">
          <span class="nav-icon">📋</span>
          <span class="nav-text">领养申请</span>
        </a>
        <a href="#" class="nav-item" data-module="users">
          <span class="nav-icon">👥</span>
          <span class="nav-text">用户管理</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
          <span>🚪</span>
          <span>退出登录</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-btn" id="menuBtn">☰</button>
          <h1 class="page-title" id="pageTitle">宠物信息管理</h1>
        </div>
        <div class="header-right">
          <span class="admin-name" id="adminName">管理员</span>
        </div>
      </header>

      <div class="content-area" id="contentArea">
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">标题</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="manage.js"></script>
</body>
</html>

    <script src="guest-auth.js"></script>
    <script>
      document.querySelectorAll(".adopt-button").forEach((btn) => {
        btn.addEventListener("click", function (e) {
          // 检查是否是游客模式
          if (localStorage.getItem('userRole') === 'guest') {
            e.preventDefault();
            e.stopPropagation();
            // 手动触发游客模式弹窗
            if (typeof showGuestModal === 'function') {
              showGuestModal();
            } else {
              // 如果函数不存在，使用简单alert
              alert("当前为游客模式，请先注册登录");
            }
            return;
          }
          
          // 获取按钮所在的卡片
          const petCard = this.closest(".pet-card-item");
          // 获取宠物ID
          const petId = petCard.getAttribute("data-pet-id");
          // 检查卡片是否有内容（通过检查宠物名字是否为空）
          const petName = petCard.querySelector(".pet-name");

          if (petName && petName.textContent.trim()) {
            // 有内容，跳转到领养页面，传递宠物ID
            window.location.href = `adopt-detail.html?petId=${petId || 'pet_001'}`;
          } else {
            // 没有内容，不跳转
            alert("该宠物信息尚未完善，暂无法领养");
          }
        });
      });
    </script>
